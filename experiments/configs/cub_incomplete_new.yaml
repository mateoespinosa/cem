      #       amount: 0.99
      #       s_vs_p: 0.5

  run_ois: false
  run_repr_avg_pred: false
  run_nis: false

  ################
  # New additions
  skip_repr_evaluation: true #false # CHANGE!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
  run_cas: false #true
  run_purity_matrix: true
  run_repr_task_matrix: true
  skip_repr_eval_datasets: ['val', 'OOD_sap_0.1_test']
  ################

  max_epochs: 100 #150
  top_k_accuracy: null
  save_model: true
  patience: 15
  emb_size: 16
  extra_dims: 0
  learning_rate: 0.01
  weight_decay: 4.0e-06
  weight_loss: true
  c_extractor_arch: "resnet18"
  optimizer: "sgd"
  bool: false
  early_stopping_monitor: "val_loss"
  early_stopping_mode: "min"
  early_stopping_delta: 0.0
  momentum: 0.9
  sigmoidal_prob: false
  training_intervention_prob: 0
  concept_loss_weight: [1, 5, 10]
runs:

  - architecture: "ConceptBottleneckModel"
    run_name: "DNN_new"
    extra_dims: 500
    sigmoidal_prob: true
    concept_loss_weight: 0
    embedding_activation: "leakyrelu"


  - architecture: "ConceptBottleneckModel"
    run_name: "DNN_localized_prior_{prior_loss_term}"
    extra_dims: 500
    sigmoidal_prob: true
    concept_loss_weight: 0
    embedding_activation: "leakyrelu"
    prior_loss_term: 10.0

  - architecture: "ConceptBottleneckModel"
    run_name: "Joint CBM"
    sigmoidal_prob: true
    concept_loss_weight: 1
    embedding_activation: "leakyrelu"
    sigmoidal_extra_capacity: false

  - architecture: "ConceptBottleneckModel"
    run_name: "Joint_CBM_prior_{prior_loss_term}"
    sigmoidal_prob: true
    concept_loss_weight: 1
    embedding_activation: "leakyrelu"
    sigmoidal_extra_capacity: false
    prior_loss_term: 10.0

  - architecture: "ConceptBottleneckModel"
    run_name: "Joint Logit CBM"
    concept_loss_weight: 1
    embedding_activation: "leakyrelu"
    sigmoidal_extra_capacity: false
    sigmoidal_prob: false


  - architecture: "ConceptBottleneckModel"
    run_name: "Joint_Logit_CBM_prior_{prior_loss_term}"
    concept_loss_weight: 1
    embedding_activation: "leakyrelu"
    sigmoidal_extra_capacity: false
    sigmoidal_prob: false
    prior_loss_term: 10.0

  - architecture: "SequentialConceptBottleneckModel"
    run_name: "Sequential CBM"
    sigmoidal_prob: true
    concept_loss_weight: 1
    embedding_activation: "leakyrelu"
    sigmoidal_extra_capacity: false

  - architecture: "IndependentConceptBottleneckModel"
    run_name: "Independent CBM"
    sigmoidal_prob: true
    concept_loss_weight: 1
    embedding_activation: "leakyrelu"
    sigmoidal_extra_capacity: false

  - architecture: "ConceptEmbeddingModel"
    run_name: "CEM"
    sigmoidal_prob: true
    training_intervention_prob: 0.25
    concept_loss_weight: 1
    embedding_activation: "leakyrelu"

  - architecture: "ConceptEmbeddingModel"
    run_name: "CEM_NoRandInt"
    concept_loss_weight: 1
    sigmoidal_prob: true
    training_intervention_prob: 0
    embedding_activation: "leakyrelu"


  - architecture: "ConceptEmbeddingModel"
    run_name: "CEM_prior_loss_term_{prior_loss_term}"
    concept_loss_weight: 1
    sigmoidal_prob: true
    training_intervention_prob: 0
    embedding_activation: "leakyrelu"
    prior_loss_term: [10, 5, 1, 0.1]
    grid_variables:
      - prior_loss_term
    grid_search_mode: exhaustive


  - architecture: "ConceptEmbeddingModel"
    run_name: "CEM_pint_{training_intervention_prob}"
    concept_loss_weight: 1
    sigmoidal_prob: true
    training_intervention_prob: [1, 0.9, 0.75, 0.5, 0.25, 0.2, 0.15, 0.1, 0.05, 0]
    embedding_activation: "leakyrelu"
    grid_variables:
      - training_intervention_prob
    grid_search_mode: exhaustive


  - architecture: "IntAwareConceptEmbeddingModel"
    run_name: "IntCEM"
    training_intervention_prob: 0.25
    concept_loss_weight: 1
    intervention_weight: 1
    intervention_task_discount: 1.1
    use_concept_groups: true
    int_model_use_bn: true
    int_model_layers: [128, 128, 64, 64]
    embedding_activation: "leakyrelu"
    max_horizon: 6
    horizon_rate: 1.005
    gradient_clip_val: 100

  - architecture: "ProbabilisticConceptBottleneckModel"
    run_name: "ProbCBM"
    learning_rate: 0.001
    weight_decay: 0
    weight_loss: false
    optimizer: "adam"
    concept_loss_weight: 1
    n_samples_inference: 50
    use_neg_concept: true
    pred_class: true
    init_negative_scale: 5
    init_shift: 5
    pretrained: true
    hidden_dim: 16
    class_hidden_dim: 64
    intervention_prob: 0.5
    gradient_clip_val: 2.0
    max_concept_epochs: 50
    warmup_epochs: 5
    max_task_epochs: 50
    vib_beta: 5.0e-05
    lr_ratio: 10

  # New ProbCBM variant: no training time random interventions
  - architecture: "ProbabilisticConceptBottleneckModel"
    run_name: "ProbCBM (No RandInt)"
    learning_rate: 0.001
    weight_decay: 0
    weight_loss: false
    optimizer: "adam"
    concept_loss_weight: 1
    n_samples_inference: 50
    use_neg_concept: true
    pred_class: true
    init_negative_scale: 5
    init_shift: 5
    pretrained: true
    hidden_dim: 16
    class_hidden_dim: 64
    intervention_prob: 0 # No RandInt
    gradient_clip_val: 2.0
    max_concept_epochs: 50
    warmup_epochs: 5
    max_task_epochs: 50
    vib_beta: 5.0e-05
    lr_ratio: 10


  # New ProbCBM variant: prior loss term included
  - architecture: "ProbabilisticConceptBottleneckModel"
    run_name: "ProbCBM_prior_loss_{prior_loss_term}"
    learning_rate: 0.001
    weight_decay: 0
    weight_loss: false
    optimizer: "adam"
    concept_loss_weight: 1
    n_samples_inference: 50
    use_neg_concept: true
    pred_class: true
    init_negative_scale: 5
    init_shift: 5
    pretrained: true
    hidden_dim: 16
    class_hidden_dim: 64
    intervention_prob: 0 # No RandInt
    gradient_clip_val: 2.0
    max_concept_epochs: 50
    warmup_epochs: 5
    max_task_epochs: 50
    vib_beta: 5.0e-05
    lr_ratio: 10
    prior_loss_term: [10, 5, 1, 0.1]
    grid_variables:
      - prior_loss_term
    grid_search_mode: exhaustive

  - architecture: "PosthocConceptBottleneckModel"
    run_name: "Posthoc CBM"
    emb_size: null
    residual: false
    reg_strength: 0.001
    l1_ratio: 0.99
    freeze_pretrained_model: true
    freeze_concept_embeddings: true
    svd_penalty: 1
    active_top_percentile: 95
    active_bottom_percentile: 5
    blackbox_model_config:
      name: "resnet18"
      imagenet_pretrained: true
      add_linear_layers: [112]
    blackbox_training_epochs: 100
    max_residual_epochs: 100
    blackbox_path: "PCBM_BlackBox_Model_resnet18_pre_True_fold_2_layers_[112]"

  - architecture: "PosthocConceptBottleneckModel"
    run_name: "Posthoc Hybrid CBM"
    emb_size: null
    residual: true
    reg_strength: 0.1
    l1_ratio: 0.99
    freeze_pretrained_model: true
    freeze_concept_embeddings: true
    svd_penalty: 1
    blackbox_model_config:
      name: "resnet18"
      imagenet_pretrained: true
      add_linear_layers: [112]
    blackbox_training_epochs: 100
    max_residual_epochs: 100
    blackbox_path: "PCBM_BlackBox_Model_resnet18_pre_True_fold_2_layers_[112]"


  - architecture: "PosthocConceptBottleneckModel"
    run_name: "Posthoc_CBM_prior_{prior_loss_term}_val_{default_intervention_bound}"
    emb_size: null
    residual: false
    reg_strength: 0.001
    l1_ratio: 0.99
    freeze_pretrained_model: true
    freeze_concept_embeddings: true
    svd_penalty: 1
    active_top_percentile: 95
    active_bottom_percentile: 5
    blackbox_model_config:
      name: "resnet18"
      imagenet_pretrained: true
      add_linear_layers: [112]
    blackbox_training_epochs: 100
    max_residual_epochs: 100
    blackbox_path: "PCBM_BlackBox_Model_resnet18_pre_True_fold_2_layers_[112]"
    default_intervention_bound: 5
    prior_loss_term: [0.1, 5, 10]
    grid_variables:
      - prior_loss_term
    grid_search_mode: exhaustive

  - architecture: "PosthocConceptBottleneckModel"
    run_name: "Posthoc_Hybrid_CBM_{prior_loss_term}_val_{default_intervention_bound}"
    emb_size: null
    residual: true
    reg_strength: 0.1
    l1_ratio: 0.99
    freeze_pretrained_model: true
    freeze_concept_embeddings: true
    svd_penalty: 1
    blackbox_model_config:
      name: "resnet18"
      imagenet_pretrained: true
      add_linear_layers: [112]
    blackbox_training_epochs: 100
    max_residual_epochs: 100
    blackbox_path: "PCBM_BlackBox_Model_resnet18_pre_True_fold_2_layers_[112]"
    default_intervention_bound: 5
    prior_loss_term: [0.1, 5, 10]
    grid_variables:
      - prior_loss_term
    grid_search_mode: exhaustive

  - architecture: "MixCEM"
    run_name: "MixCEM"
    training_intervention_prob: 0.25
    concept_loss_weight: 1
    all_intervened_loss_weight: 1
    ood_dropout_prob: 0.5
    calibration_epochs: 30

  - architecture: "MixCEM"
    run_name: "MixCEM_pint_{training_intervention_prob}_lambda_{concept_loss_weight}"
    training_intervention_prob: [0, 0.25, 1]
    concept_loss_weight: 1
    all_intervened_loss_weight: 1
    ood_dropout_prob: 0.5
    calibration_epochs: 30
    grid_variables:
      - training_intervention_prob
    grid_search_mode: exhaustive


  - architecture: "ConceptBottleneckModel"
    run_name: "Hybrid-CBM_dims_{extra_dims}"
    extra_dims: [500, 100, 50, 10]
    sigmoidal_prob: true
    concept_loss_weight: 1
    embedding_activation: "leakyrelu"
    grid_variables:
      - extra_dims
    grid_search_mode: exhaustive

  - architecture: "ConceptBottleneckModel"
    run_name: "Hybrid-CBM_dims_{extra_dims}_pint_{training_intervention_prob}"
    extra_dims: 500
    training_intervention_prob: [1, 0.5, 0.25]
    sigmoidal_prob: true
    concept_loss_weight: 1
    embedding_activation: "leakyrelu"
    grid_variables:
      - training_intervention_prob
    grid_search_mode: exhaustive

  - architecture: "ConceptBottleneckModel"
    run_name: "Hybrid-CBM_dims_{extra_dims}_prior_loss_term_{prior_loss_term}_only_con_{prior_only_concepts}"
    extra_dims: 500
    prior_loss_term: [10, 5, 1, 0.1]
    sigmoidal_prob: true
    concept_loss_weight: 1
    embedding_activation: "leakyrelu"
    prior_only_concepts: [true, false]
    grid_variables:
      - prior_loss_term
      - prior_only_concepts
    grid_search_mode: exhaustive

  - architecture: "ConceptBottleneckModel"
    run_name: "Hybrid-CBM_dims_{extra_dims}_prior_loss_term_{prior_loss_term}_only_con_{prior_only_concepts}"
    extra_dims: [1000, 500, 250, 125, 50, 25]
    prior_loss_term: [5]
    sigmoidal_prob: true
    concept_loss_weight: 1
    embedding_activation: "leakyrelu"
    prior_only_concepts: [false]
    grid_variables:
      - extra_dims
      - prior_loss_term
      - prior_only_concepts
    grid_search_mode: exhaustive


  - architecture: "ConceptBottleneckModel"
    run_name: "Hybrid-CBM_no_wd_dims_{extra_dims}_prior_loss_term_{prior_loss_term}_only_con_{prior_only_concepts}"
    extra_dims: [1000, 500, 250, 125, 50, 25]
    prior_loss_term: [5]
    sigmoidal_prob: true
    concept_loss_weight: 1
    embedding_activation: "leakyrelu"
    prior_only_concepts: [false]
    weight_decay: 0 # DIFFERENCE!!!!!!!!!!!!!!
    grid_variables:
      - extra_dims
      - prior_loss_term
      - prior_only_concepts
    grid_search_mode: exhaustive










  # Baseline: no leakage at all
  - architecture: "LeakyReprCBM"
    run_name: "LeakyReprCBM-Logit_Baseline_prob_correct_{prob_correct}"
    training_intervention_prob: 0.0
    prior_loss_term: 0.0
    total_range_size: 0  # No range here so this will have no leakage at all
    encode_concepts: false
    encode_tasks: true  # Not used as we habe no range here
    random_bucket_noise: false
    concept_loss_weight: 0
    sigmoidal_prob: false
    max_repr_val: 10000
    prob_correct: [0.85, 0.8] #, 0.95,]
    leak_provided_concepts: false
    leak_unprovided_concepts: false
    grid_variables:
      - prob_correct
    grid_search_mode: exhaustive


  # Baseline: no leakage at all
  - architecture: "LeakyReprCBM"
    run_name: "LeakyReprCBM-Logit_New_Baseline_prob_correct_{prob_correct}"
    training_intervention_prob: 0.0
    prior_loss_term: 0.0
    total_range_size: 0  # No range here so this will have no leakage at all
    encode_concepts: false
    encode_tasks: true  # Not used as we habe no range here
    random_bucket_noise: false
    concept_loss_weight: 0
    sigmoidal_prob: false
    max_repr_val: 5
    prob_correct: [0.85]
    leak_provided_concepts: false
    leak_unprovided_concepts: false
    grid_variables:
      - prob_correct
    grid_search_mode: exhaustive


  # Logits encode tasks
  - architecture: "LeakyReprCBM"
    run_name: "LeakyReprCBM-Logit_tasks_range_{total_range_size}_prior_{prior_loss_term}_r_{random_bucket_noise}_prob_correct_{prob_correct}"
    training_intervention_prob: 0.0
    prior_loss_term: [0.0, 0.1, 1.0, 5.0, 10.0, 100.0]
    total_range_size: [10000]
    encode_concepts: false
    encode_tasks: true
    random_bucket_noise: false
    concept_loss_weight: 0
    sigmoidal_prob: false
    leak_provided_concepts: false
    leak_unprovided_concepts: false
    max_repr_val: 10000
    prob_correct: [0.85, 0.75]

    grid_variables:
      - prob_correct
      - total_range_size
      - prior_loss_term
    grid_search_mode: exhaustive


    # Logits encode tasks
  - architecture: "LeakyReprCBM"
    run_name: "LeakyReprCBM-Logit_tasks_flips_{prob_flips}_range_{total_range_size}_prior_{prior_loss_term}_r_{random_bucket_noise}_prob_correct_{prob_correct}"
    training_intervention_prob: 0.0
    prior_loss_term: [0.0, 0.1, 1.0, 10.0]
    total_range_size: [200]
    encode_concepts: false
    encode_tasks: true
    random_bucket_noise: false
    concept_loss_weight: 0
    sigmoidal_prob: false
    leak_provided_concepts: false
    leak_unprovided_concepts: false
    max_repr_val: 100
    learning_rate: 0.0001
    prob_correct: [0.85] #, 0.75]
    prob_flips: [0.0, 0.3]

    grid_variables:
      - prob_correct
      - total_range_size
      - prior_loss_term
      - prob_flips
    grid_search_mode: exhaustive


  # Logits encode tasks
  - architecture: "LeakyReprCBM"
    run_name: "LeakyReprCBM-Logit_tasks_flips_{prob_flips}_range_{total_range_size}_prior_{prior_loss_term}_r_{random_bucket_noise}_prob_correct_{prob_correct}"
    training_intervention_prob: 0.0
    prior_loss_term: [0.0, 0.1, 1.0, 10.0]
    total_range_size: [10]
    encode_concepts: false
    encode_tasks: true
    random_bucket_noise: false
    concept_loss_weight: 0
    sigmoidal_prob: false
    leak_provided_concepts: false
    leak_unprovided_concepts: false
    max_repr_val: 10
    prob_correct: [0.85] #, 0.75]
    prob_flips: [0.0, 0.3]

    grid_variables:
      - prob_correct
      - total_range_size
      - prior_loss_term
      - prob_flips
    grid_search_mode: exhaustive

  # Logits encode tasks
  - architecture: "LeakyReprCBM"
    run_name: "LeakyReprCBM-Logit_tasks_flips_{prob_flips}_range_{total_range_size}_prior_{prior_loss_term}_r_{random_bucket_noise}_prob_correct_{prob_correct}"
    training_intervention_prob: 0.0
    prior_loss_term: [0.0, 0.1, 1.0, 10.0]
    total_range_size: [10000]
    encode_concepts: false
    encode_tasks: true
    random_bucket_noise: false
    concept_loss_weight: 0
    sigmoidal_prob: false
    leak_provided_concepts: false
    leak_unprovided_concepts: false
    max_repr_val: 10000
    prob_correct: [0.85] #, 0.75]
    prob_flips: [0.3]

    grid_variables:
      - prob_correct
      - total_range_size
      - prior_loss_term
      - prob_flips
    grid_search_mode: exhaustive


  # Logits encode tasks with different range sizes
  - architecture: "LeakyReprCBM"
    run_name: "LeakyReprCBM-Logit_range_{total_range_size}_prior_{prior_loss_term}_c_{encode_concepts}_t_{encode_tasks}_r_{random_bucket_noise}_prob_correct_{prob_correct}"
    training_intervention_prob: 0.0
    prior_loss_term: [0.0, 10.0]
    total_range_size: [10000, 1000, 100, 10, 1]
    encode_concepts: false
    encode_tasks: true
    random_bucket_noise: false
    concept_loss_weight: 0
    sigmoidal_prob: false
    leak_provided_concepts: false
    leak_unprovided_concepts: false
    max_repr_val: 10000
    prob_correct: [0.85]

    grid_variables:
      - prob_correct
      - total_range_size
      - prior_loss_term
    grid_search_mode: exhaustive


  # Logits encode tasks with different range sizes
  - architecture: "LeakyReprCBM"
    run_name: "LeakyReprCBM-Logit_tasks_flips_{prob_flips}_range_{total_range_size}_prior_{prior_loss_term}_r_{random_bucket_noise}_prob_correct_{prob_correct}"
    training_intervention_prob: 0.0
    prior_loss_term: [0.0]
    total_range_size: [10000, 1000, 100, 10, 1]
    encode_concepts: false
    encode_tasks: true
