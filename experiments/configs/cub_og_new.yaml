  - architecture: "ConceptEmbeddingModel"
    run_name: "CEM_prior_loss_term_{prior_loss_term}_lr_{learning_rate}_opt_{optimizer}_ep_{max_epochs}_cw_{concept_loss_weight}"
    concept_loss_weight: [10] #, 5, 1]
    sigmoidal_prob: true
    training_intervention_prob: 0
    prior_loss_term: [10, 5, 1] #, 5, 1]
    embedding_activation: "leakyrelu"
    learning_rate: [0.01] #0.01
    weight_decay: 1.0e-06
    weight_loss: true
    c_extractor_arch: "resnet18"
    optimizer: ["sgd"] #"sgd"
    max_epochs: [100]
    emb_size: 8 #16
    grid_variables:
      - prior_loss_term
      - learning_rate
      - optimizer
      - max_epochs
      - concept_loss_weight
    grid_search_mode: exhaustive

  - architecture: "ConceptEmbeddingModel"
    run_name: "new_CEM_prior_loss_term_{prior_loss_term}_lr_{learning_rate}_opt_{optimizer}_ep_{max_epochs}_cw_{concept_loss_weight}"
    concept_loss_weight: [1] #, 5, 1]
    sigmoidal_prob: true
    training_intervention_prob: 0
    prior_loss_term: [2, 1, 0.5] #, 5, 1]
    embedding_activation: "leakyrelu"
    learning_rate: [0.01] #0.01
    weight_decay: 1.0e-06
    weight_loss: true
    c_extractor_arch: "resnet18"
    optimizer: ["sgd", "adam"] #"sgd"
    max_epochs: [150]
    emb_size: 8 #16
    task_loss_weight: 0.1
    grid_variables:
      - prior_loss_term
      - learning_rate
      - optimizer
      - max_epochs
      - concept_loss_weight
    grid_search_mode: exhaustive


  # - architecture: "ConceptEmbeddingModel"
  #   run_name: "CEM_prior_loss_term_{prior_loss_term}_lr_{learning_rate}_opt_{optimizer}_ep_{max_epochs}_cw_{concept_loss_weight}_emb_{emb_size}"
  #   concept_loss_weight: [10, 1]
  #   sigmoidal_prob: true
  #   training_intervention_prob: 0
  #   prior_loss_term: [5, 1]
  #   embedding_activation: "leakyrelu"
  #   learning_rate: [0.01] #0.01
  #   weight_decay: 1.0e-06
  #   weight_loss: true
  #   c_extractor_arch: "resnet18"
