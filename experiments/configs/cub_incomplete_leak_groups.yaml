  #   grid_search_mode: exhaustive

  # Leak all unprovided concepts but make random mistakes
  - architecture: "LeakyReprCEM"
    run_name: "LeakyReprCEM_proj_flips_{prob_flips}_nb_{neg_base}_sub_{dataset_config[sampling_percent]}_prior_{prior_loss_term}_c_{encode_concepts}_t_{encode_tasks}_prob_correct_{prob_correct}"
    training_intervention_prob: 0.0
    prior_loss_term: [0.0, 10.0]
    encode_concepts: true # Encode the unprovided concepts as part of the representation
    encode_tasks: false
    concept_loss_weight: 0
    leak_provided_concepts: false
    leak_unprovided_concepts: true # We will use the unprovided concepts!
    prob_correct: [0.85]
    n_leak_concepts: "{{112 - {n_concepts}}}"
    prob_flips: [0.15, 0.05, 0.0]
    prob_encoding_mode: projection
    neg_base: 0
    # max_epochs: 15

    grid_variables:
      - prob_correct
      - prior_loss_term
      - dataset_config.sampling_percent
      - prob_flips
    grid_search_mode: exhaustive


  # Leak all provided concepts but make random mistakes
  - architecture: "LeakyReprCEM"
    run_name: "LeakyReprCEM_proj_provided_concepts_flips_{prob_flips}_nb_{neg_base}_sub_{dataset_config[sampling_percent]}_prior_{prior_loss_term}_prob_correct_{prob_correct}"
    training_intervention_prob: 0.0
    prior_loss_term: [0.0, 10.0]
    encode_concepts: true # Encode the unprovided concepts as part of the representation
    encode_tasks: false
    concept_loss_weight: 0
    leak_provided_concepts: true
    leak_unprovided_concepts: false # We will use the unprovided concepts!
    prob_correct: [0.85]
    n_leak_concepts: "{{112 - {n_concepts}}}"
    prob_flips: [0.15, 0.05, 0.0]
    prob_encoding_mode: projection
    neg_base: 0
    # max_epochs: 15

    grid_variables:
      - prob_correct
      - prior_loss_term
      - dataset_config.sampling_percent
      - prob_flips
    grid_search_mode: exhaustive


  # Leak ALL concepts but make random mistakes
  - architecture: "LeakyReprCEM"
    run_name: "LeakyReprCEM_proj_all_concepts_flips_{prob_flips}_nb_{neg_base}_sub_{dataset_config[sampling_percent]}_prior_{prior_loss_term}_prob_correct_{prob_correct}"
    training_intervention_prob: 0.0
    prior_loss_term: [0.0, 10.0]
    encode_concepts: true # Encode the unprovided concepts as part of the representation
    encode_tasks: false
    concept_loss_weight: 0
    leak_provided_concepts: true
    leak_unprovided_concepts: true
    prob_correct: [0.85]
    n_leak_concepts: "{{112 - {n_concepts}}}"
    prob_flips: [0.15, 0.05, 0.0]
    prob_encoding_mode: projection
    neg_base: 0
    # max_epochs: 15

    grid_variables:
      - prob_correct
      - prior_loss_term
      - dataset_config.sampling_percent
      - prob_flips
    grid_search_mode: exhaustive

