  skip_repr_evaluation: true
  max_epochs: 100
  top_k_accuracy: null
  save_model: true
  patience: 15
  emb_size: 16
  extra_dims: 0
  concept_loss_weight: [1, 5, 10]
  learning_rate: 0.01
  weight_decay: 4.0e-06
  weight_loss: true
  c_extractor_arch: "resnet18"
  optimizer: "sgd"
  bool: false
  early_stopping_monitor: "val_loss"
  early_stopping_mode: "min"
  early_stopping_delta: 0.0
  momentum: 0.9
  sigmoidal_prob: false
  training_intervention_prob: 0
  num_load_workers: 0
runs:

  # Baseline: no leakage at all
  - architecture: "LeakyReprCBM"
    run_name: "LeakyReprCBM-Logit_Baseline_prob_correct_{prob_correct}"
    training_intervention_prob: 0.0
    prior_loss_term: [0.0, 10.0]
    total_range_size: [0.5]
    encode_concepts: false
    random_bucket_noise: [false] #, true]
    concept_loss_weight: 0
    sigmoidal_prob: False
    leak_provided_concepts: false
    leak_unprovided_concepts: false
    # max_repr_val: 0.1
    max_repr_val: 5
    prob_correct: [0.85]
    prob_flips: [0.0, 0.3]
    encode_tasks: 0 # HACK!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
    max_epochs: 50 # DIFFERENCE!!!!!!!!!!!!!!!!!!!!!!!

    grid_variables:
      - prob_correct
      - total_range_size
      - prior_loss_term
      - prob_flips
      - random_bucket_noise
    grid_search_mode: exhaustive

  # Logits encode tasks
  - architecture: "LeakyReprCBM"
    run_name: "LeakyReprCBM-Logit-tasks_flips_{prob_flips}_range_{total_range_size}_prior_{prior_loss_term}_r_{random_bucket_noise}_prob_correct_{prob_correct}"
    training_intervention_prob: 0.0
    prior_loss_term: [0.0, 10.0]
    total_range_size: [0.5]
    encode_concepts: false
    random_bucket_noise: [false, true] #, true]
    concept_loss_weight: 0
    sigmoidal_prob: False
    leak_provided_concepts: false
    leak_unprovided_concepts: false
    # max_repr_val: 0.1
    max_repr_val: 5
    prob_correct: [0.85]
    prob_flips: [0.0, 0.3]
    encode_tasks: 10 # HACK!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
    max_epochs: 50 # DIFFERENCE!!!!!!!!!!!!!!!!!!!!!!!

    grid_variables:
      - prob_correct
      - total_range_size
      - prior_loss_term
      - prob_flips
      - random_bucket_noise
    grid_search_mode: exhaustive

