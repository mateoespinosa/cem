  - architecture: "MixCEM"
    run_name: "MixCEM"
    max_epochs: 150
    concept_loss_weight: 1
    training_intervention_prob: 0.25
    all_intervened_loss_weight: 0.1
    ood_dropout_prob: 0.5
    calibration_epochs: 30

  - architecture: "MixCEM"
    run_name: "MixCEM_pint_{training_intervention_prob}_lambda_{concept_loss_weight}"
    max_epochs: 150
    concept_loss_weight: 1
    training_intervention_prob: [0, 0.25, 1]
    all_intervened_loss_weight: 0.1
    ood_dropout_prob: 0.5
    calibration_epochs: 30
    grid_variables:
      - training_intervention_prob
    grid_search_mode: exhaustive



  - architecture: "ConceptBottleneckModel"
    run_name: "Hybrid-CBM_dims_{extra_dims}"
    extra_dims: [500, 100, 50, 10]
    sigmoidal_prob: true
    concept_loss_weight: 1
    embedding_activation: "leakyrelu"
    grid_variables:
      - extra_dims
    grid_search_mode: exhaustive


  - architecture: "ConceptBottleneckModel"
    run_name: "Hybrid-CBM_dims_{extra_dims}_prior_loss_term_{prior_loss_term}_only_con_{prior_only_concepts}"
    extra_dims: 500
    prior_loss_term: [10, 5, 1, 0.1]
    sigmoidal_prob: true
    concept_loss_weight: 1
    embedding_activation: "leakyrelu"
    prior_only_concepts: [true, false]
    grid_variables:
      - prior_loss_term
      - prior_only_concepts
    grid_search_mode: exhaustive

  - architecture: "ConceptBottleneckModel"
    run_name: "Hybrid-CBM_dims_{extra_dims}_prior_loss_term_{prior_loss_term}_only_con_{prior_only_concepts}"
    extra_dims: [1000, 500, 250, 125, 50, 25]
    prior_loss_term: [5]
    sigmoidal_prob: true
    concept_loss_weight: 1
    embedding_activation: "leakyrelu"
    prior_only_concepts: [false]
    grid_variables:
      - extra_dims
      - prior_loss_term
      - prior_only_concepts
    grid_search_mode: exhaustive