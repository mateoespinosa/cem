model_selection_groups:
  - ["DNN_new", "DNN"]
  - ["Joint CBM", "Joint CBM"]
  - ["Joint Logit CBM", "Joint Logit CBM"]
  - ["Sequential CBM", "Sequential CBM"]
  - ["Independent CBM", "Independent CBM"]
  - ["CEM", "CEM"]
  - ["^(CEM_NoRandInt).*$", "CEM (No RandInt)"]
  - ["^(CEM_prior_loss_term).*$", "CEM (Prior Loss)"]
  - ["IntCEM", "IntCEM"]
  - ["ProbCBM", "ProbCBM"]
  - ["Posthoc CBM", "Posthoc CBM"]
  - ["Posthoc Hybrid CBM", "Posthoc Hybrid CBM"]
  - ["MixCEM", "MixCEM"]
  - [".*(MixCEM_pint_0_).*$", "MixCEM (No RandInt)"]
  - ["MixCEM_pint_{training_intervention_prob}_lambda_{concept_loss_weight}", "MixCEM (RandInt)"]
  - ["^(Hybrid-CBM_dims_).*", "Hybrid-CBM"]
  - ["^(Hybrid-CBM_dims_).*(_pint_.*)", "Hybrid-CBM (RandInt)"]
  - ["^(Hybrid-CBM_dims_).*(_prior_loss_term_).*", "Hybrid-CBM (Prior Loss)"]

shared_params:
  results_dir: "results/cifar10/"
  trials: 3
  model_selection_trials: 3
  results_fname: new_results
  dataset_config:
    dataset: "cifar10"
    num_workers: 8
    batch_size: 512
    binarization_mode: "percentile_threshold"
    regenerate: true
    threshold: 50
    root_dir: /anfs/bigdisc/me466/cifar10
    sampling_percent: 1
    sampling_groups: true
    test_subsampling: 1
    weight_loss: true
  intervention_config:
    competence_levels: [1]
    intervention_freq: 11
    intervention_batch_size: 512
    val_intervention_policies:
      - policy: "random"
        group_level: true
        use_prior: false
    intervention_policies:
      - policy: "random"
        group_level: true
        use_prior: false
  eval_config:
    additional_metrics:
      - name: "mixcem_sel"
        include_list: [".*(MixCEM_).*"]
    additional_test_sets:
      - name: "OOD_sap_0.1"
        update_previous: true
        dataset_config:
          test_transformation_config:
            post_generation: false
            name: "salt_and_pepper"
            amount: 0.1
            s_vs_p: 0.5
  skip_repr_evaluation: true
  max_epochs: 50
  top_k_accuracy: null
  save_model: true
  patience: 15
  emb_size: 16
  extra_dims: 0
  concept_loss_weight: [10, 1]
  learning_rate: 0.01
  weight_decay: 1.0e-06
  weight_loss: true
  c_extractor_arch: "resnet18"
  optimizer: "sgd"
  bool: false
  early_stopping_monitor: "val_loss"
  early_stopping_mode: "min"
  early_stopping_delta: 0.0
  momentum: 0.9
  sigmoidal_prob: false
  training_intervention_prob: 0
  num_load_workers: 0
runs:

  - architecture: "ConceptBottleneckModel"
    run_name: "DNN_new"
    extra_dims: 100
    concept_loss_weight: 0
    sigmoidal_prob: true
    embedding_activation: "leakyrelu"

  - architecture: "ConceptBottleneckModel"
    run_name: "Joint CBM"
    concept_loss_weight: 10
    sigmoidal_prob: true
    embedding_activation: "leakyrelu"
    sigmoidal_extra_capacity: false

  - architecture: "ConceptBottleneckModel"
    run_name: "Joint Logit CBM"
    concept_loss_weight: 10
    embedding_activation: "leakyrelu"
    sigmoidal_extra_capacity: false

  - architecture: "SequentialConceptBottleneckModel"
    run_name: "Sequential CBM"
    concept_loss_weight: 1
    sigmoidal_prob: true
    embedding_activation: "leakyrelu"
    sigmoidal_extra_capacity: false

  - architecture: "IndependentConceptBottleneckModel"
    run_name: "Independent CBM"
    concept_loss_weight: 1
    sigmoidal_prob: true
    embedding_activation: "leakyrelu"
    sigmoidal_extra_capacity: false

  - architecture: "ConceptBottleneckModel"
    run_name: "Hybrid-CBM"
    extra_dims: 50
    concept_loss_weight: 1
    sigmoidal_prob: true
    embedding_activation: "leakyrelu"

  - architecture: "ConceptEmbeddingModel"
    run_name: "CEM"
    concept_loss_weight: 1
    sigmoidal_prob: true
    training_intervention_prob: 0.25
    embedding_activation: "leakyrelu"

  - architecture: "ConceptEmbeddingModel"
    run_name: "CEM_NoRandInt"
    concept_loss_weight: 1
    sigmoidal_prob: true
    training_intervention_prob: 0
    embedding_activation: "leakyrelu"

  - architecture: "ConceptEmbeddingModel"
    run_name: "CEM_prior_loss_term_{prior_loss_term}"
    concept_loss_weight: 1
    sigmoidal_prob: true
    training_intervention_prob: 0
    prior_loss_term: [10, 5, 1, 0.1]
    embedding_activation: "leakyrelu"
    grid_variables:
      - prior_loss_term
    grid_search_mode: exhaustive


  - architecture: "ConceptEmbeddingModel"
    run_name: "CEM_prior_loss_term_{prior_loss_term}_lamb_{concept_loss_weight}"
    concept_loss_weight: 10
    sigmoidal_prob: true
    training_intervention_prob: 0
    prior_loss_term: [10, 5, 1, 0.1]
    embedding_activation: "leakyrelu"
    grid_variables:
      - prior_loss_term
    grid_search_mode: exhaustive


  - architecture: "IntAwareConceptEmbeddingModel"
    run_name: "IntCEM"
    concept_loss_weight: 1
    training_intervention_prob: 0.25
    intervention_weight: 5
    intervention_task_discount: 1.1
    use_concept_groups: true
    int_model_use_bn: true
    int_model_layers: [128, 128, 64, 64]
    embedding_activation: "leakyrelu"
    max_horizon: 6
    horizon_rate: 1.005
    gradient_clip_val: 100

