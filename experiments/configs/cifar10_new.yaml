model_selection_trials: 1
model_selection_groups:
  - ["DNN_new$", "DNN"]
  - ["(DNN_localized_prior_).*", "DNN (Prior Loss)"]
  - ["(CBM_Sigmoid_Baseline_cwl_).*", "Joint CBM"]
  - ["(Joint_CBM_prior_).*", "Joint CBM (Prior Loss)"]
  - ["(CBM_Logit_Baseline_cwl_).*", "Joint Logit CBM"]
  - ["(Joint_Logit_CBM_prior_).*", "Joint Logit CBM (Prior Loss)"]
  - ["CBM_Seq$", "Sequential CBM"]
  - ["CBM_Ind", "Independent CBM"]
  - ["(CEM_Baseline_).*", "CEM"]
  - ["^(CEM_NoRandInt).*$", "CEM (No RandInt)"]
  - ["^(CEM_prior_loss_term).*$", "CEM (Prior Loss)"]
  - ["(IntCEM_).*", "IntCEM"]
  - ["(ProbCBM_).*", "ProbCBM"]
  - ["(PCBM_).*$", "Posthoc CBM"]
  - ["(HybridPCBM_reg_).*", "Posthoc Hybrid CBM"]
  - ["MixCEM$", "MixCEM"]
  - [".*(MixCEM_pint_0_).*$", "MixCEM (No RandInt)"]
  - ["MixCEM_pint_{training_intervention_prob}_lambda_{concept_loss_weight}", "MixCEM (RandInt)"]
  - ["Hybrid-CBM$", "Hybrid-CBM"]
  - ["^(Hybrid-CBM_dims_).*(_prior_loss_term_).*", "Hybrid-CBM (Prior Loss)"]

model_selection_metrics:
  - val_acc_y_random_group_level_True_use_prior_False_int_auc
  - val_acc_y


shared_params:
  results_dir: /anfs/bigdisc/me466/mixcem_results/cifar10/
  trials: 3
  results_fname: new_results
  dataset_config:
    dataset: "cifar10"
    num_workers: 8
    batch_size: 512
    binarization_mode: "percentile_threshold"
    regenerate: true
    threshold: 50
    root_dir: /anfs/bigdisc/me466/cifar10
    sampling_percent: 1
    sampling_groups: true
    test_subsampling: 1
    weight_loss: true
  intervention_config:
    competence_levels: [1]
    intervention_freq: 11
    intervention_batch_size: 512
    val_intervention_policies:
      - policy: "random"
        group_level: true
        use_prior: false
    intervention_policies:
      - policy: "random"
        group_level: true
        use_prior: false

  skip_repr_evaluation: true
  max_epochs: 50
  top_k_accuracy: null
  save_model: true
  patience: 15
  emb_size: 16
  extra_dims: 0
  concept_loss_weight: [10, 1]
  learning_rate: 0.01
  weight_decay: 1.0e-06
  weight_loss: true
  c_extractor_arch: "resnet18"
  optimizer: "sgd"
  bool: false
  early_stopping_monitor: "val_loss"
  early_stopping_mode: "min"
  early_stopping_delta: 0.0
  momentum: 0.9
  sigmoidal_prob: false
  training_intervention_prob: 0
  num_load_workers: 0

runs:
  - architecture: "ConceptBottleneckModel"
    run_name: "DNN_new"
    extra_dims: 100
    concept_loss_weight: 0
    sigmoidal_prob: true
    embedding_activation: "leakyrelu"

  - architecture: "ConceptBottleneckModel"
    run_name: "DNN_localized_prior_{prior_loss_term}"
    extra_dims: 100
    sigmoidal_prob: true
    concept_loss_weight: 0
    embedding_activation: "leakyrelu"
    prior_loss_term: 10.0

  - architecture: "ConceptBottleneckModel"
    run_name: "CBM_Sigmoid_Baseline_cwl_{concept_loss_weight}"
    concept_loss_weight: 10
    sigmoidal_prob: true
    embedding_activation: "leakyrelu"
    sigmoidal_extra_capacity: false

  - architecture: "ConceptBottleneckModel"
    run_name: "Joint_CBM_prior_{prior_loss_term}"
    sigmoidal_prob: true
    concept_loss_weight: 10
    embedding_activation: "leakyrelu"
    sigmoidal_extra_capacity: false
    prior_loss_term: 10.0

  - architecture: "ConceptBottleneckModel"
    run_name: "CBM_Logit_Baseline_cwl_{concept_loss_weight}"
    concept_loss_weight: 10
    embedding_activation: "leakyrelu"
    sigmoidal_extra_capacity: false

  - architecture: "ConceptBottleneckModel"
    run_name: "Joint_Logit_CBM_prior_{prior_loss_term}"
    concept_loss_weight: 10
    embedding_activation: "leakyrelu"
    sigmoidal_extra_capacity: false
    sigmoidal_prob: false
    prior_loss_term: 10.0

  - architecture: "SequentialConceptBottleneckModel"
    run_name: "CBM_Seq"
    concept_loss_weight: 1
    sigmoidal_prob: true
    embedding_activation: "leakyrelu"
    sigmoidal_extra_capacity: false

  - architecture: "IndependentConceptBottleneckModel"
    run_name: "CBM_Ind"
    concept_loss_weight: 1
    sigmoidal_prob: true
    embedding_activation: "leakyrelu"
    sigmoidal_extra_capacity: false

  - architecture: "ConceptBottleneckModel"
    run_name: "Hybrid-CBM"
    extra_dims: 100
    concept_loss_weight: 1
    sigmoidal_prob: true
    embedding_activation: "leakyrelu"

  - architecture: "ConceptEmbeddingModel"
    run_name: "CEM_Baseline_cwl_{concept_loss_weight}"
    concept_loss_weight: 1
    sigmoidal_prob: true
    training_intervention_prob: 0.25
    embedding_activation: "leakyrelu"

  - architecture: "ConceptEmbeddingModel"
    run_name: "CEM_NoRandInt"
    concept_loss_weight: 1
    sigmoidal_prob: true
    training_intervention_prob: 0
    embedding_activation: "leakyrelu"

  - architecture: "ConceptEmbeddingModel"
    run_name: "CEM_prior_loss_term_{prior_loss_term}"
    concept_loss_weight: 1
    sigmoidal_prob: true
    training_intervention_prob: 0
    prior_loss_term: [10, 5, 1]
    embedding_activation: "leakyrelu"
    grid_variables:
      - prior_loss_term
    grid_search_mode: exhaustive

  - architecture: "ConceptEmbeddingModel"
    run_name: "CEM_prior_loss_term_{prior_loss_term}_lr_{learning_rate}_opt_{optimizer}_ep_{max_epochs}"
    concept_loss_weight: 1
    sigmoidal_prob: true
    training_intervention_prob: 0
    prior_loss_term: [5, 10]
    embedding_activation: "leakyrelu"
    learning_rate: [0.001] #0.01
    weight_decay: 1.0e-06
    weight_loss: true
    c_extractor_arch: "resnet18"
    optimizer: ["adam"] #"sgd"
    max_epochs: [50] #, 100]
    grid_variables:
      - prior_loss_term
      - learning_rate
      - optimizer
      - max_epochs
    grid_search_mode: exhaustive

  - architecture: "ConceptEmbeddingModel"
    run_name: "CEM_prior_loss_term_{prior_loss_term}_cw_{concept_loss_weight}"
    concept_loss_weight: [10]
    sigmoidal_prob: true
    training_intervention_prob: 0
    prior_loss_term: [10, 5, 1]
    embedding_activation: "leakyrelu"
    grid_variables:
      - prior_loss_term
      - concept_loss_weight
    grid_search_mode: exhaustive

  - architecture: "ConceptBottleneckModel"
    run_name: "Hybrid-CBM_dims_{extra_dims}_prior_loss_term_{prior_loss_term}_only_con_{prior_only_concepts}"
    extra_dims: 100
    prior_loss_term: [10, 1]
    sigmoidal_prob: true
    concept_loss_weight: 1
    embedding_activation: "leakyrelu"
    prior_only_concepts: [false]
    grid_variables:
      - prior_loss_term
      - prior_only_concepts
    grid_search_mode: exhaustive
